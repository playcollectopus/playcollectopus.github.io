<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collectopus invite</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --ink:#0B0A12; --surface:#15141F; --text:#F4F2EE; --soft:#C9C6D6; --muted:#A3A1B3; --lime:#C8FF2E; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--ink); color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; text-align:center; }
  img { width:96px; height:96px; border-radius:24px; }
  h1 { font-size:26px; line-height:1.2; margin:20px 0 8px; }
  p { color:var(--soft); margin:0 0 16px; }
  .code { background:var(--surface); border-radius:20px; padding:20px; margin:24px 0; }
  .code small { display:block; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; font-size:12px; }
  .code strong { display:block; font:700 40px/1.2 ui-monospace,Menlo,monospace; letter-spacing:.3em; margin-top:6px; color:var(--lime); }
  a.button { display:block; background:var(--lime); color:var(--ink); text-decoration:none; font-weight:700;
             border-radius:16px; padding:16px; margin-bottom:12px; }
  .hint { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1 id="title">You're invited to Collectopus</h1>
  <p>Point your camera at real things — dogs, cars, birds, food — and collect them as cards.</p>
  <div class="code" id="codeBox" hidden>
    <small>Friend code</small>
    <strong id="code"></strong>
  </div>
  <a class="button" id="open" href="#" hidden>Open Collectopus</a>
  <p class="hint" id="hint">Already have the app? Open Profile → Friends → Enter a friend's code. You both get +10 catches.</p>
</main>
<script>
  // /i/ABC123 → ABC123 (any other address: just the invite text).
  var m = location.pathname.match(/^\/i\/([A-Za-z0-9]{6})\/?$/);
  if (m) {
    var code = m[1].toUpperCase();
    document.getElementById('code').textContent = code;
    document.getElementById('codeBox').hidden = false;
    var open = document.getElementById('open');
    open.href = 'intent://' + location.host + '/i/' + code +
      '#Intent;scheme=https;package=app.collectopus;end';
    open.hidden = !/Android/i.test(navigator.userAgent);
  } else {
    document.getElementById('title').textContent = 'Collectopus';
  }
</script>
</body>
</html>
