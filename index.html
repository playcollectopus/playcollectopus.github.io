<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collectopus</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root { --ink:#0B0A12; --soft:#C9C6D6; --text:#F4F2EE; --lime:#C8FF2E; }
  body { margin:0; min-height:100vh; background:var(--ink); color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; text-align:center; }
  main { max-width:420px; }
  img { width:112px; height:112px; border-radius:28px; }
  h1 { font-size:32px; margin:20px 0 8px; }
  p { color:var(--soft); margin:0 0 12px; }
  .soon { color:var(--lime); font-weight:700; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>Collectopus</h1>
  <p>Point your camera at real things — dogs, cars, birds, food — and collect them as cards with a rarity.</p>
  <p class="soon">Coming soon to Google Play.</p>
</main>
</body>
</html>
